[project]
name = "boknlp"
version = "0.1.0"
description = "BOK Monetary Policy Board minutes NLP research"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "pysbd==0.3.4",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
